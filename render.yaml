# 프로젝트 폴더가 Git 저장소 루트인 경우 사용하는 Render Blueprint입니다.
services:
  - type: web
    name: matzip-journey
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: KAKAO_MAP_JS_KEY
        sync: false
