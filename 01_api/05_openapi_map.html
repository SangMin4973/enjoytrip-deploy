<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>유관 링크</h1>
    <ul>
      <li><a href="https://apis.map.kakao.com/web/">카카오맵 API</a></li>
      <li>
        <a href="https://www.data.go.kr/index.do">공공데이터(enjoytrip)</a>
      </li>
    </ul>

    <div>
      <label>지역 코드 기반의 서비스(Enjoy Trip): </label>
      <select id="selectClass1" data-type="대분류">
        <option value="" selected disabled>대분류 선택</option>
      </select>
      <select id="selectClass2" data-type="중분류">
        <option value="" selected disabled>중분류 선택</option>
      </select>
      <select id="selectClass3" data-type="소분류">
        <option value="" selected disabled>소분류 선택</option>
      </select>
      <select id="selectSido" data-type="시도">
        <option value="" selected disabled>시도 선택</option>
      </select>
      <select id="selectGugun" data-type="구군">
        <option value="" selected disabled>구군 선택</option>
      </select>
      <button id="btn_trip_search">관광지 조회</button>
      <button id="btn_around_search">주변 관광지 조회</button>
    </div>
    <hr />
    <div id="map" style="width: 100%; height: 500px"></div>
  </body>
  <!--TODO: 01-05. 필요한 모듈을 import 해보자. -->
  <script type="module">
    import { loadKakaoMap, initMap, updateMap } from "./js/kakao.js";
    import { initEnjoyTrip } from "./js/enjoytrip.js";

    // 초기 지도에 표시될 기본 캠퍼스 위치 데이터
    const defaultPositions = [
      {
        address: "서울특별시 강남구 테헤란로 212",
        label: "서울캠퍼스",
      },
      {
        address: "경북 구미시 3공단 3로 302",
        label: "구미캠퍼스",
      },
      {
        address: "부산광역시 강서구 송정동 녹산산업중로 333",
        label: "부울경캠퍼스",
      },
      {
        address: "광주광역시 광산구 하남산단 6번로 107",
        label: "광주캠퍼스",
      },
      {
        address: "대전광역시 유성구 동서대로 98-39",
        label: "대전캠퍼스",
      },
    ];

    // 카카오 지도 API를 로드한 뒤 초기화를 수행합니다.
    loadKakaoMap().then(() => {
      initMap("map");

      // TODO: 01-06. updateMap()와 연관된 함수를 분석해보세요. 
      updateMap(defaultPositions);

      // TODO: 01-08. areaCode1()과 연관된 함수를 분석해보세요. 
      initEnjoyTrip(); // enjoytrip.js
    });
  </script>
</html>
