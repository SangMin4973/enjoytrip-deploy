<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>마커 생성하기</title>
  </head>
  <body>
    <div id="map" style="width: 100%; height: 350px"></div>
    <div style="margin-top: 10px">
      <button id="btn_move">마커 이동하기 (위도 +1)</button>
    </div>

    <script type="module">
      import { loadKakaoMap } from "./js/kakao.js";

      // 1. 지도 관련 전역 변수 선언 (여러 함수와 이벤트에서 접근할 수 있도록 분리)
      let map = null;
      const markers = [];

      // 2. 마커를 표시할 초기 위치와 title 데이터 배열
      const positions = [
        {
          title: "카카오",
          latlng: { lat: 33.450705, lng: 126.570677 },
        },
        {
          title: "생태연못",
          latlng: { lat: 33.450936, lng: 126.569477 },
        },
        {
          title: "텃밭",
          latlng: { lat: 33.450879, lng: 126.56994 },
        },
        {
          title: "근린공원",
          latlng: { lat: 33.451393, lng: 126.570738 },
        },
      ];

      // 3. 지도가 비동기 로딩 완료(Resolve)되었을 때의 처리
      loadKakaoMap().then(() => {
        const mapContainer = document.getElementById("map");
        const mapOption = {
          center: new kakao.maps.LatLng(33.450701, 126.570667), // 지도의 중심좌표
          level: 3, // 지도의 확대 레벨
        };

        map = new kakao.maps.Map(mapContainer, mapOption); // 지도를 생성합니다

        drawMarkers();
      });

      function drawMarkers() {
        // TODO: 01-04. 기존 마커를 지우고, 변경된 위치로 마커를 재합성하고 영역을 맞춰주는 헬퍼 함수를 구현하세요.
        //  (1) 기존 지도 위의 마커 지우기 및 배열 초기화
        markers.forEach(marker => marker.setMap(null))
        markers.length = 0;
        //  (2) 모든 마커가 보일 수 있도록 영역을 계산할 Bounds 객체 생성
        const bounds = new kakao.maps.LastLngBounds();
        //  (3) positions 배열의 좌표들을 기반으로 마커 생성 및 영역 누적
        positions.forEach(position => {
          const latlng = new kakao.map.LatLng(position.latlng.lat, postion.latlng.lng)

          bounds.extend(latlng)
        })

        const marker = new kakao.maps.Marker({
          map: map,
          postion: latlng,
          title: position.title
        })
        markers.push(marker)
        //  (4) 모든 마커가 보이도록 지도 화면 크기 및 중심점 자동 맞춤
        map.setBounds(bounds)
        // END
      }

      // 5. 버튼 클릭 시 이벤트: 위도(lat)를 1씩 증가시키고 마커 재렌더링
      document.querySelector("#btn_move").addEventListener("click", () => {
        positions.forEach((pos) => {
          pos.latlng.lat += 1; // 북쪽으로 위도를 1도씩 이동
        });
        // 갱신된 위치로 다시 그리기 실행
        drawMarkers();
      });
    </script>
  </body>
</html>
