<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffdf70">
  <title>이야기 수정 · 맛집기행</title>
  <link rel="stylesheet" href="../css/board.css">
  <script type="module" src="../js/board.js"></script>
</head>
<body data-board-page="modify">
  <a class="skip-link" href="#board-main">본문으로 이동</a>
  <header class="board-header"><a class="board-brand" href="/index.html#home">맛집기행<span>!</span></a><nav aria-label="메인 메뉴"><a href="/index.html#home">맛집 찾기</a><a href="./list.html">이야기 게시판</a></nav></header>
  <main id="board-main" class="board-shell editor-shell">
    <a class="board-back" href="./list.html">← 이야기 게시판</a>
    <section class="board-intro compact" aria-labelledby="page-title"><div><span class="board-eyebrow">EDIT YOUR STORY</span><h1 id="page-title">이야기 다듬기<span class="title-spark" aria-hidden="true">✦</span></h1><p>기억하고 싶은 내용을 조금 더 담아보세요.</p></div></section>
    <p id="board-feedback" class="board-feedback" role="status" aria-live="polite" hidden></p>
    <section class="board-window" aria-labelledby="editor-title"><div class="board-titlebar"><span id="editor-title">한 끼의 기록 수정</span><span aria-hidden="true">▪ ▪ ▪</span></div>
      <form id="modifyFrm" class="board-editor" hidden>
        <div id="post-context-editor"></div>
        <div class="editor-row"><div class="editor-field title-field"><label for="post-subject">제목 <span>필수</span></label><input id="post-subject" name="subject" type="text" maxlength="120" required></div><div class="editor-field writer-field"><label for="post-writer">작성자 <span>필수</span></label><input id="post-writer" name="writer" type="text" maxlength="40" required autocomplete="nickname"></div></div>
        <div class="editor-field"><div class="content-label"><label for="post-content">이야기 <span>필수</span></label><span id="content-count">0 / 10,000</span></div><textarea id="post-content" name="content" maxlength="10000" required></textarea></div>
        <p class="editor-note">처음 등록한 날짜와 조회수는 그대로 유지됩니다.</p>
        <div class="editor-actions"><a id="back" href="./list.html" class="board-button">취소</a><button type="submit" class="board-button primary">수정 내용 저장 →</button></div>
      </form>
    </section>
  </main>
  <footer class="board-footer"><a href="/index.html#home">© 2026 맛집기행</a><span>한 끼의 기억을, 오래도록.</span></footer>
</body>
</html>
