<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffdf70">
  <title>이야기 쓰기 · 맛집기행</title>
  <link rel="stylesheet" href="../css/board.css">
  <script type="module" src="../js/board.js"></script>
</head>
<body data-board-page="write">
  <a class="skip-link" href="#board-main">본문으로 이동</a>
  <header class="board-header"><a class="board-brand" href="/index.html#home">맛집기행<span>!</span></a><nav aria-label="메인 메뉴"><a href="/index.html#home">맛집 찾기</a><a href="./list.html">이야기 게시판</a></nav></header>
  <main id="board-main" class="board-shell editor-shell">
    <a class="board-back" href="./list.html">← 이야기 게시판</a>
    <section class="board-intro compact" aria-labelledby="page-title"><div><span class="board-eyebrow">WRITE YOUR STORY</span><h1 id="page-title">맛집 이야기 쓰기<span class="title-spark" aria-hidden="true">✦</span></h1><p>음식점 후기와 별점을 남기거나 나의 북마크를 소개해 주세요.</p></div></section>
    <p id="board-feedback" class="board-feedback" role="status" aria-live="polite" hidden></p>
    <section class="board-window" aria-labelledby="editor-title"><div class="board-titlebar"><span id="editor-title">새로운 한 끼의 기록</span><span aria-hidden="true">▪ ▪ ▪</span></div>
      <form id="writeFrm" class="board-editor">
        <div id="post-context-editor"></div>
        <div class="editor-row"><div class="editor-field title-field"><label for="post-subject">제목 <span>필수</span></label><input id="post-subject" name="subject" type="text" maxlength="120" required placeholder="어떤 맛있는 이야기를 들려주실 건가요?"></div><div class="editor-field writer-field"><label for="post-writer">작성자 <span>필수</span></label><input id="post-writer" name="writer" type="text" maxlength="40" required placeholder="이름 또는 닉네임" autocomplete="nickname"></div></div>
        <div class="editor-field"><div class="content-label"><label for="post-content">이야기 <span>필수</span></label><span id="content-count">0 / 10,000</span></div><textarea id="post-content" name="content" maxlength="10000" required placeholder="어디에서, 무엇을 드셨나요?&#10;맛집의 분위기나 여행 중 기억에 남는 순간을 자유롭게 적어보세요."></textarea></div>
        <p class="editor-note" id="editor-storage-note">후기에는 음식점과 별점을, 북마크 공유에는 나의 북마크를 선택해 주세요.</p>
        <div class="editor-actions"><a href="./list.html" class="board-button">취소</a><button type="submit" class="board-button primary">이야기 등록하기 →</button></div>
      </form>
    </section>
  </main>
  <footer class="board-footer"><a href="/index.html#home">© 2026 맛집기행</a><span>한 끼의 기억을, 오래도록.</span></footer>
</body>
</html>
